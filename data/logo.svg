<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple Badminton Shuttlecock Icon -->
  <g transform="translate(60, 40)">
    <!-- Cork (top sphere) -->
    <circle cx="0" cy="0" r="15" fill="currentColor"/>

    <!-- Feather cone -->
    <path d="M -10,15 Q -15,35 -12,55 L 0,65 L 12,55 Q 15,35 10,15 Z"
          fill="currentColor"
          opacity="0.8"/>

    <!-- Feather lines -->
    <line x1="-6" y1="15" x2="-8" y2="55" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="15" x2="0" y2="65" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="6" y1="15" x2="8" y2="55" stroke="white" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
