# Nginx 配置 - 五道口AI创业羽毛球俱乐部
# 适用于: Ubuntu/Debian
# 位置: /etc/nginx/sites-available/wdk-badminton

# 上游服务器配置（PM2 管理的 Next.js 实例）
upstream nextjs_backend {
    # 如果使用单实例
    server 127.0.0.1:3000;

    # 如果使用多实例（推荐生产环境）
    # server 127.0.0.1:3000;
    # server 127.0.0.1:3001;
    # server 127.0.0.1:3002;

    # 负载均衡策略
    # least_conn;  # 最少连接
    # ip_hash;     # IP hash（保持会话）

    keepalive 64;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name wdk-badminton.com www.wdk-badminton.com;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 主服务器
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wdk-badminton.com www.wdk-badminton.com;

    # ========== SSL 配置 ==========
    ssl_certificate /etc/letsencrypt/live/wdk-badminton.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wdk-badminton.com/privkey.pem;

    # SSL 协议版本（推荐）
    ssl_protocols TLSv1.2 TLSv1.3;

    # SSL 加密套件
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;

    # SSL Session 缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/wdk-badminton.com/chain.pem;

    # ========== Gzip 压缩 ==========
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # ========== 静态文件缓存 ==========

    # Next.js 静态资源（_next/static）
    location /_next/static/ {
        proxy_pass http://nextjs_backend;
        proxy_cache_valid 200 365d;
        proxy_cache_bypass $http_cache_control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 公共静态资源（/static, /images, /fonts等）
    location ~* ^/(static|images|fonts|assets)/ {
        proxy_pass http://nextjs_backend;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000"; # 30 days
    }

    # Favicon
    location = /favicon.ico {
        proxy_pass http://nextjs_backend;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800"; # 7 days
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        proxy_pass http://nextjs_backend;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400"; # 1 day
        access_log off;
    }

    # ========== Socket.io WebSocket 支持 ==========
    location /socket.io/ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        # WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（WebSocket 长连接）
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # 禁用缓存
        proxy_buffering off;
    }

    # ========== API 路由 ==========
    location /api/ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 禁用缓存
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header X-Cache-Status "BYPASS";
    }

    # ========== 所有其他请求代理到 Next.js ==========
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        # WebSocket 支持（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓存控制
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_pragma $http_authorization;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ========== 安全头 ==========

    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # XSS 保护
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer 策略
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 内容安全策略（可根据需要调整）
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    # HSTS（强制 HTTPS）- 生产环境启用
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ========== 日志 ==========
    access_log /var/log/nginx/wdk-badminton-access.log combined;
    error_log /var/log/nginx/wdk-badminton-error.log warn;

    # ========== 错误页面 ==========
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ========== 限流（可选）==========
    # 限制单个 IP 的请求频率
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # location /api/ {
    #     limit_req zone=api_limit burst=20 nodelay;
    #     proxy_pass http://nextjs_backend;
    # }

    # ========== 文件上传限制 ==========
    client_max_body_size 50M;
    client_body_buffer_size 1M;
}
