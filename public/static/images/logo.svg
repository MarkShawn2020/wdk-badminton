<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#FF6B35" opacity="0.1"/>

  <!-- Badminton Shuttlecock -->
  <g transform="translate(100, 80)">
    <!-- Cork (top part) -->
    <circle cx="0" cy="0" r="12" fill="#FF6B35"/>

    <!-- Feathers -->
    <path d="M -8,12 Q -12,25 -10,40 L 0,50 L 10,40 Q 12,25 8,12 Z"
          fill="white"
          stroke="#FF6B35"
          stroke-width="2"/>
    <path d="M -4,12 L -6,45" stroke="#FF6B35" stroke-width="1" opacity="0.5"/>
    <path d="M 0,12 L 0,50" stroke="#FF6B35" stroke-width="1" opacity="0.5"/>
    <path d="M 4,12 L 6,45" stroke="#FF6B35" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Text: WDK -->
  <text x="100" y="145"
        font-family="Arial, sans-serif"
        font-size="32"
        font-weight="bold"
        text-anchor="middle"
        fill="#FF6B35">WDK</text>

  <!-- Subtitle -->
  <text x="100" y="165"
        font-family="Arial, sans-serif"
        font-size="12"
        text-anchor="middle"
        fill="#666">五道口羽毛球</text>
</svg>
